name: Isometricon CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-assets:
    name: Validate Shaders & Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check GLSL Shader Syntax Integrity
        run: |
          echo "Checking GLSL Shaders..."
          for file in assets/shaders/*; do
            if [ -f "$file" ]; then
              echo "Found shader: $file"
              head -n 1 "$file" | grep -q "#version" || { echo "Missing #version in $file"; exit 1; }
            fi
          done
          echo "All shaders verified."

      - name: Verify Documentation & Structural Integrity
        run: |
          test -f README.md || exit 1
          test -f docs/ARCHITECTURE.md || exit 1
          test -f docs/INTEGRATION_SPEC.md || exit 1
          test -f docs/SHADERS.md || exit 1
          echo "Project documentation and structural layout are valid."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest tests/ -v
