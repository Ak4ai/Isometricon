name: Release Pipeline (Cross-Platform Builds)

on:
  push:
    branches: [ main ]
    paths:
      - 'VERSION'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release & Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag_name: ${{ steps.get-version.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Version
        id: get-version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION=$(cat VERSION | tr -d '[:space:]')
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Target Version: ${VERSION}, Tag: ${TAG}"

      - name: Create Git Tag and Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get-version.outputs.tag_name }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          # Criar Release como Rascunho (Draft) se ainda não existir
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Criando draft release para $TAG..."
            gh release create "$TAG" --title "Isometricon $TAG" --generate-notes --draft
          else
            echo "Release $TAG já existe."
          fi

  build-windows:
    name: Build Windows (Portable & Installer)
    runs-on: windows-latest
    needs: prepare-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Portable (OneDir)
        run: |
          pyinstaller --noconsole --onedir --add-data "assets;assets" --name "Isometricon" src/main.py
          Compress-Archive -Path dist/Isometricon -DestinationPath "dist/Isometricon-v${{ needs.prepare-release.outputs.version }}-Windows-Portable.zip" -Force

      - name: Build Windows Standalone Executable (OneFile)
        run: |
          pyinstaller --noconsole --onefile --add-data "assets;assets" --name "Isometricon-Installer" src/main.py
          Move-Item "dist/Isometricon-Installer.exe" "dist/Isometricon-v${{ needs.prepare-release.outputs.version }}-Windows-Installer.exe" -Force

      - name: Upload Windows Binaries to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          gh release upload "$env:TAG" "dist/Isometricon-v${{ needs.prepare-release.outputs.version }}-Windows-Portable.zip" "dist/Isometricon-v${{ needs.prepare-release.outputs.version }}-Windows-Installer.exe" --clobber

  build-linux:
    name: Build Linux (Portable)
    runs-on: ubuntu-latest
    needs: prepare-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Portable
        run: |
          pyinstaller --onedir --add-data "assets:assets" --name "isometricon" src/main.py
          tar -czvf "dist/Isometricon-v${{ needs.prepare-release.outputs.version }}-Linux-Portable.tar.gz" -C dist isometricon

      - name: Upload Linux Binary to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          gh release upload "$TAG" "dist/Isometricon-v${{ needs.prepare-release.outputs.version }}-Linux-Portable.tar.gz" --clobber

  publish-release:
    name: Publish Official Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-windows, build-linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish Release (Set Draft to False)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          gh release edit "$TAG" --draft=false
          echo "Release $TAG publicada com sucesso no GitHub!"
